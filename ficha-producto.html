                <li> <a href="catalogo.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <button class="menu-boton" id="menu-boton" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
                <span></span>
                <span></span>
                <span></span>

        </nav>

    </header>

    <main>

        <section class="ficha">
            <div class="ficha-galeria">
                <div class="foto-marco" id="foto-marco">
                    <img id="producto-img" class="foto-principal" src="" alt="" draggable="false">
                    <button class="foto-flecha foto-flecha-anterior" id="foto-anterior" aria-label="Foto anterior"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg></button>

                </div>
                <div class="miniaturas" id="producto-miniaturas"></div>
            </div>

            <div class="ficha-info">
                <p class="categoria" id="producto-categoria"></p>
                <h1 id="producto-nombre"></h1>
                <p class="descripcion" id="producto-descripcion"></p>
                <div class="colores" id="producto-colores" hidden></div>

                <div class="medidas" id="producto-medidas" hidden>
                    <p class="spec-titulo" id="producto-medidas-titulo"></p>
                    <ul id="producto-medidas-lista"></ul>
                </div>

                <ul class="specs" id="producto-specs"></ul>

                <div class="combina" id="producto-combina" hidden>
                    <p class="spec-titulo">Combina con</p>
                    <ul id="producto-combina-lista"></ul>
                </div>

                <a href="contacto.html" class="boton-consulta">Consultar disponibilidad</a>
            </div>
        </section>
