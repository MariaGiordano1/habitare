<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="facebook-domain-verification" content="xuthbr1cpdjx8swkjpc3ymaqly1uxm" />
    <meta name="robots" content="noindex">
    <title>Habitare</title>
    <script>
        // Dirección vieja (ficha-producto.html?id=...): pasa a la página del producto.
        const parametros = new URLSearchParams(window.location.search);
        const id = parametros.get("id");
        if (id && /^[a-z0-9-]+$/.test(id)) {
            parametros.delete("id");
            const resto = parametros.toString();
            window.location.replace("productos/" + id + ".html" + (resto ? "?" + resto : ""));
        } else {
            window.location.replace("catalogo.html");
        }
    </script>
</head>

<body>
    <p><a href="catalogo.html">Ir al catálogo</a></p>
</body>

</html>
