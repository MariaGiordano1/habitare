<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/contacto.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="apple-touch-icon" href="img/favicon-180.png">
    <title>Contacto - Habitare</title>
    <script src="js/animaciones.js"></script>
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">HABITARE</a>
            <ul class="menu" id="menu">
                <li> <a href="catalogo.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
            <button class="menu-boton" id="menu-boton" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>

    </header>

    <main>
        <section class="container-form">
            <div class="form-img">
                <img src="./img/formularioimg.jpg" alt="">
            </div>
            <div class="formulario">
                <div class="encabezado">
                    <p class="etiqueta">Contacto</p>
                    <h1>Solicitá el catálogo</h1>
                    <p class="intro">Dejanos tus datos y te contactamos para enviarte el catálogo y resolver tus consultas.</p>
                </div>

                <form>
                    <div class="fila">
                        <div class="campo">
                            <label class="sr-only" for="nombre">Nombre</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                        </div>
                        <div class="campo">
                            <label class="sr-only" for="apellido">Apellido</label>
                            <input type="text" id="apellido" name="apellido" placeholder="Apellido" required>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="campo">
                            <label class="sr-only" for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Email" required>
                        </div>
                        <div class="campo">
                            <label class="sr-only" for="whatsapp">WhatsApp</label>
                            <input type="tel" id="whatsapp" name="whatsapp" placeholder="WhatsApp" required>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="campo">
                            <label class="sr-only" for="ciudad">Ciudad</label>
                            <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad" required>
                        </div>
                        <div class="campo">
                            <label class="sr-only" for="negocio">Tipo de negocio</label>
                            <select id="negocio" name="negocio" required>
                                <option value="">Tipo de negocio</option>
                                <option value="muebleria">Mueblería</option>
                                <option value="interiorismo">Estudio de interiorismo</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="nombre-negocio">Nombre del negocio</label>
                        <input type="text" id="nombre-negocio" name="nombre-negocio" placeholder="Nombre del negocio (opcional)">
                    </div>

                    <div class="campo">
                        <label class="sr-only" for="mensaje">¿En qué podemos ayudarte?</label>
                        <textarea id="mensaje" name="mensaje" placeholder="¿En qué podemos ayudarte?"></textarea>
                    </div>

                    <div class="check">
                        <input type="checkbox" id="checkbox" name="llamada" value="aceptado">
                        <label for="checkbox">Permitir que me hagan una llamada telefónica</label>
                    </div>

                    <button type="submit">Enviar consulta</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <a href="index.html" class="footer-logo">Habitare</a>

        <div class="footer-info">
            <p>&copy; Habitare 2026. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>

</html>
